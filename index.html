<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Username Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <main>
        <header>
            <div class="navbar">
                <span class="logo">devfinder</span>
                <button class="dark-theme-btn" id="toggle"><i class="fa-sharp fa-solid fa-moon" id="theme-toggle"></i><span class="dark">Dark</span></button>
            </div>
        </header>

        <form>
            <i class="fa-solid fa-magnifying-glass"></i>
            <label for="search">
            <input type="text" placeholder="Search GitHub username.." id="search" required>
            </label>
            <button type="submit" class="search-btn">Search</button>
        </form>


        <div class="container">
        <div class="user-offline"><p class="offline-message">Network problem, check your internet connection.🚫</p></div>
        <div class="user-not-found"> <p class="not-found-message"></p> </div>
        <div class="profile-container">

            <img src="./assets/jpg-file/octocatl.jpg" alt="Octocat" class="avatar">

            <div class="name-date">
            <div class="user-name-container"><h2 class="profile-name">The Octocat</h2><small class="username">@octocat</small></div>
            <p class="date">Joined 25 Jan 2011</p>
        </div>

        <p class="biography">This profile has no bio</p>

        <div class="status-card">
            <div class="card-1">
                <small class="repos">Repos</small>
                <h3 class="total-repos">8</h3>
            </div>

            <div class="card-2">
                <small class="followers">Followers</small>
                <h3 class="total-followers">3938</h3>
            </div>

            <div class="card-3">
                <small class="following">Following</small>
                <h3 class="total-following">9</h3>
            </div>
        </div>
        <section>
            <div class="item-1">
            <div class="address-container"><i class="fa-solid fa-location-dot"></i><span class="address">San Francisco</span></div>
            <div class="link-container"><i class="fa-solid fa-link"></i><a href ="" class="links">https://github.blog</a></div>
            </div>

            <div class="item-2">
                 <div class="social-container"><i class="fa-brands fa-twitter"></i><a href="" class="social">Not available</a></div>
                 <div class="work-container"><i class="fa-solid fa-building"></i><span class="work">Not available</span></div>
            </div>
        </section>
        </div>
        </div>
    </main>

    <script src="github.js"></script>
    
</body>
</html>
